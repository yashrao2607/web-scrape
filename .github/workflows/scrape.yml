name: FD Rate Scraper

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run scraper
        run: node main.js
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}

      - name: Generate Excel
        run: node scripts/json-to-excel.js

      - name: Commit Excel to repo
        run: |
          git config user.name "fd-scraper-bot"
          git config user.email "bot@users.noreply.github.com"
          git add output/FD_Rates.xlsx
          git commit -m "Update FD_Rates.xlsx [skip ci]" || echo "No changes"
          git push

      - name: Upload output artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scrape-results
          path: output/
          retention-days: 7
